
name: estulanches

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estulanches}
      POSTGRES_USER: ${POSTGRES_USER:-estu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data                 
      - ./db:/docker-entrypoint-initdb.d:ro  

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]

  app:
    build:
      context: .
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: estulanches/app:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    init: true                                        
    depends_on:
      db:
        condition: service_healthy                      
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-estu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-estulanches}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?defina ADMIN_API_KEY no arquivo .env}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    ports:
      - "${APP_PORT:-3000}:3000"
    read_only: true                                     
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [interna]

  tests:                                                
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-estu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-estulanches}
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:
