name: CI
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: estu, POSTGRES_PASSWORD: senha_ci, POSTGRES_DB: estulanches }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estu" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://estu:senha_ci@localhost:5432/estulanches
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: docker build --target production -t estulanches/app:ci .
